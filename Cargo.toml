[package]
name = "raikou"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Redis-compatible server"
license = "MIT"
repository = "https://github.com/brokentari/raikou"
readme = "README.md"
keywords = ["redis", "server", "resp", "database"]
categories = ["database-implementations"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "raikou"
path = "src/main.rs"

[[test]]
name = "compat"
path = "tests/compat/main.rs"
harness = false

[[bench]]
name = "perf"
path = "benches/perf.rs"
harness = false

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
mod_module_files = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "allow"
